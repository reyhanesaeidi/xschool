<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ریحانه سعیدی</title>

    <link rel="icon" type="image/png"
        href="https://uploadkon.ir/uploads/153c30_26X-school-Copy.png">

    <style>
        @font-face {
            font-family: 'BNazanin';
            src: url('B-NAZANIN.TTF') format('truetype');
        }

        body {
            position: relative;
            font-family: 'BNazanin', Tahoma, sans-serif;
            font-size: 20px;
            color: black;
            text-align: right;

            background: url("https://uploadkon.ir/uploads/25b425_26ChatGPT-Image-May-25-2026-12-34-46-PM.png") no-repeat center center fixed;
            background-size: cover;
        }

        .lang-en {
            font-family: "Times New Roman", Times, serif;
            font-size: 18px;
        }

        /* منوی بالا */

        .topMenu-right {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            padding: 20px 40px;
            Margin-left: 45px;
        }

        .blueGradientButton {
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 20px;
            color: #002060;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .blueGradientButton:hover {
            background: #002060;
            color: white;
            border: 1px solid #002060;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .blueGradientButtonCurrent {
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 20px;
            color: #002060;
            font-weight: bold;
            background: #eef4ff;
        }

        .hero {
            text-align: center;
            margin-top: 150px;
        }

        .title {
            color: black;
            font-size: 64px;
            margin: 0;
            min-height: 80px;
        }

        .subtitle {
            color: black;
            font-size: 28px;
            margin-top: 5px;

            opacity: 0;
            animation: fadeIn 1.5s ease forwards;
            animation-delay: 2s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <nav class="topMenu-right">

        <a href="NearFuture.html" class="blueGradientButton">
            <span class="lang-en">HTML</span> یادگیری🔎
        </a>

        <a href="about.html" class="blueGradientButton">
            من کیم؟👩‍🎓
        </a>

        <a href="index.html" class="blueGradientButtonCurrent">
            خانه
            <img src="https://uploadkon.ir/uploads/153c30_26X-school-Copy.png"
                width="20"
                height="20"
                alt="logo">
        </a>

    </nav>

    <div class="hero">
        <h1 id="typingText" class="title"></h1>

        <p class="subtitle">
            یک جونیور در تمام زمینه‌ها
        </p>
    </div>

    <script>
        const text = "مَن ریحانه هَستَم";
        const target = document.getElementById("typingText");

        let i = 0;

        function typeWriter() {
            if (i < text.length) {
                target.textContent += text.charAt(i);
                i++;
                setTimeout(typeWriter, 100);
            }
        }

        typeWriter();
    </script>

</body>

</html>
